# Development configuration, seeded into the dev stack on first boot.
# Delete the volume to re-seed:  docker compose -f deploy/dev/docker-compose.dev.yml down -v

charter: |
  Curated external links about self-hosting, privacy, homelabs, open source and
  self-hosted AI go to the test channel, written for French-speaking
  self-hosters: what it is, why it matters to someone running their own server.

  Skip anything that is pure consumer tech news, a deal or a sponsored post.

  AppStore app releases go to the test channel too, written for a general
  public: what the app is, who it is for, what is new.

mcp_endpoints:
  # A Beacon aggregator running on YOUR machine, not in this stack.
  # The trailing slash matters: /mcp answers 307 to /mcp/.
  - id: beacon
    name: local beacon
    url: http://host.docker.internal:3000/mcp/

browser_engines:
  # The headed Chromium in this stack. `viewer: novnc` puts it inside the desk,
  # proxied behind the desk's own session — the container has no host port.
  - id: sidecar
    name: Dev browser
    api_base: http://browser:9746
    viewer: novnc

voices:
  - id: alicia
    name: Alicia
    tone: concise, technical, anti-hype; never invents a claim
    audience: self-hosters and homelabbers running a personal cloud
    rules: |
      No marketing superlatives. Always say who should care and why.
      Structure: what it is, what it is for, what is new, why it matters, how to get it.

stringers:
  - id: tip-line
    name: Tip line
    kind: tip

  - id: korben
    name: korben.info
    kind: timeline
    hint: self-hosting, privacy, homelab, open source, self-hosted AI only

  - id: github-appstore
    name: GitHub stringer — AppStore releases
    kind: report
    hint: user-facing releases only

outlets:
  # The local Beacon aggregates claude-code and chrome-devtools only — there is
  # no discord-mcp on it — so this outlet is configured but cannot actually
  # deliver in dev. It exists so the managing editor has somewhere to placement stories and
  # the writer has a voice and slots to fill. Publishing is Phase 3.
  - id: discord-test
    # Quoted: an unquoted `#` starts a YAML comment.
    name: "Discord #news-test"
    description: |
      Test channel. General audience of self-hosters. Announcements of app
      releases and curated external links worth their attention.
    role: publish
    driver: mcp
    voice: alicia
    endpoint: beacon
    tool: discord-mcp__send_embed
    args:
      channelId: "1514993197082742814"
      timestamp: true
      footer: "{{story.url}}"
      title:
        slot: text
        label: Headline
        max: 256
      description:
        slot: markdown
        label: Body
        max: 4096
        primary: true

  # The local sink. Nothing leaves the machine: the delivery port records the
  # payload and reports success, so approval, the payload freeze, the ledger and
  # the event log can all be exercised end to end without a real destination.
  # A dev Beacon has no discord-mcp, and an outlet that silently did nothing
  # would be indistinguishable from one that worked.
  - id: local-sink
    name: Local sink
    description: |
      Development sink. Placement a story here to watch the whole path — draft,
      review, approve, publish — without sending anything anywhere.
    role: publish
    driver: builtin
    voice: alicia
    args:
      title:
        slot: text
        label: Headline
        max: 256
      description:
        slot: markdown
        label: Body
        max: 4096
        primary: true

  # A destination with no API, published the way a person would: the desk opens
  # the page, types what you approved, proves it byte for byte, and then stops
  # so you can press their publish button. `composer` is the stand-in site in
  # this stack (deploy/dev/fixtures/composer.html) — swap the url and the
  # selectors and the same outlet drives a real one.
  - id: devgram
    name: Devgram
    description: |
      A site with no API. Placement a story here to watch a browser publish end
      to end — hand over, compose, byte-check, your click, then verify.
    role: publish
    driver: browser
    voice: alicia
    engine: sidecar
    args:
      # The page, pinned. The desk navigates here itself; the recipe never
      # names it, because a destination in prose is a destination a model or an
      # assistant could quietly move.
      url: "http://composer/"
      body:
        slot: markdown
        label: Post
        max: 4096
        primary: true
    recipe: |
      ## Stage
      The composer is the textarea at the top of the page.
      wait: textarea#composer
      fill: textarea#composer <- body

      ## Hand over
      Read the post, then press the green **Publish** button under the box.

      ## Verify
      The newest post appears first, with its permalink as the link above it.
      read: #posts a.permalink -> url

  # A real destination behind a real login. Docmost has an API, but driving it
  # through the browser is the point here: it exercises the sign-in handoff,
  # which is the part of browser publishing that needs a person.
  #
  # Verified end to end against Docmost 0.70.3 on 2026-08-03: hover, create the
  # child page, fill both editors, byte-compare, read the permalink back.
  - id: docmost-news
    name: Docmost — News
    description: |
      The News page of the internal knowledge base. Each story that runs here
      becomes its own page filed underneath it — a written-up note for the team,
      longer than a Discord post and kept for reference, not an announcement.
    role: publish
    driver: browser
    voice: alicia
    engine: sidecar
    args:
      # The parent page, pinned. The desk navigates here itself and files the
      # new page underneath it; the recipe never names it, because a destination
      # in prose is a destination a model or an assistant could quietly move.
      url: "https://docmost-yunderalabs.nsl.sh/s/general/p/news-ivnqzhLjY1"
      title:
        slot: text
        label: Headline
        # Becomes the page title, and Docmost builds the page's slug from it.
        max: 200
      body:
        slot: text
        label: Note
        max: 8000
        primary: true
        # `text`, not `markdown`, and the hint is why. The desk fills the editor
        # with the frozen bytes in one insertion, which is what keeps invariant 2
        # provable — but it also means ProseMirror's input rules never fire, so
        # "## Heading" is stored as a paragraph reading "## Heading". Markdown
        # here would publish its own syntax to the reader. Verified 2026-08-03.
        hint: |
          Plain prose in paragraphs. No markdown syntax — no #, no *, no -
          bullets: this destination stores what it is given literally, so the
          characters would show up on the page.
    recipe: |
      ## Signed out
      Docmost bounces an unauthenticated visit to /login, where the email field
      is the one thing a signed-in page never has.
      when: input#email[type="email"]

      ## Stage
      The desk lands on the News page, whose row in the sidebar tree is the
      selected one. That row's buttons are `visibility: hidden` until the
      pointer is on it, so the hover is not decoration — without it the click
      waits for a button that never becomes visible. The + files a fresh child
      page under News and opens it.

      Docmost renders two ProseMirror editors on a page, the title and the body,
      identical but for their containers — hence `.page-title` and
      `.editor-container` rather than the bare `.ProseMirror` a first reading
      suggests, which would put the note in the title.

      The wait after the + is on an *empty* title, and that is the whole point.
      Creating the child page and opening it took 6.5s when measured, and the
      News page the desk is standing on has a title editor of its own that
      matches 100ms after the click — so a wait on the editor alone returns
      while the browser is still on the parent, and the story is typed over the
      destination page instead of into a new one. Docmost autosaves, so that is
      not recoverable by failing later. `h1.is-editor-empty` is the placeholder
      state of a brand-new page and the parent can never have it.
      wait:  a.isSelected
      hover: a.isSelected
      click: a.isSelected button:has(svg.tabler-icon-plus)
      wait:  .page-title .ProseMirror[contenteditable="true"] h1.is-editor-empty
      fill:  .page-title .ProseMirror[contenteditable="true"] <- title
      fill:  .editor-container .ProseMirror[contenteditable="true"] <- body

      ## Hand over
      Docmost has no publish button — it saves as the desk types, so this page
      is already live under News. Read it, fix anything you want to fix, and
      confirm here.

      Note: staging creates the page. If it fails partway you may find an
      "untitled" page under News; delete it.

      ## Verify
      Once filed, the selected row in the tree is the new page, and its href is
      the permalink — Docmost rebuilds the slug from the headline.
      read: a.isSelected -> url

# ── Reporting ───────────────────────────────────────────────────────────────
# Switched OFF in dev: the phase needs a search endpoint the dev stack can
# actually reach, and our SearXNG lives on holyhorse behind the SSO gate, on a
# `pcs` network this machine is not part of.
#
# To try it, run a SearXNG locally with the json format enabled (settings.yml:
# `search: {formats: [html, json]}`) and uncomment the block below — the shape
# is verified, only the host changes. Without it tips go straight to the
# managing editor, unreported.
#
# reporting:
#   enabled: true
#   kinds: [tip]
#   search:
#     - driver: http
#       url: http://host.docker.internal:8080/search
#       args:
#         q: "{{ call.query }}"
#         format: json
#   fetch: []
