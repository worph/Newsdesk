# Development configuration, seeded into the dev stack on first boot.
# Delete the volume to re-seed:  docker compose -f deploy/dev/docker-compose.dev.yml down -v

charter: |
  Curated external links about self-hosting, privacy, homelabs, open source and
  self-hosted AI go to the test channel, written for French-speaking
  self-hosters: what it is, why it matters to someone running their own server.

  Skip anything that is pure consumer tech news, a deal or a sponsored post.

  AppStore app releases go to the test channel too, written for a general
  public: what the app is, who it is for, what is new.

mcp_endpoints:
  # A Beacon aggregator running on YOUR machine, not in this stack.
  # The trailing slash matters: /mcp answers 307 to /mcp/.
  - id: beacon
    name: local beacon
    url: http://host.docker.internal:3000/mcp/

voices:
  - id: alicia
    name: Alicia
    tone: concise, technical, anti-hype; never invents a claim
    audience: self-hosters and homelabbers running a personal cloud
    rules: |
      No marketing superlatives. Always say who should care and why.
      Structure: what it is, what it is for, what is new, why it matters, how to get it.

stringers:
  - id: tip-line
    name: Tip line
    kind: tip

  - id: korben
    name: korben.info
    kind: timeline
    hint: self-hosting, privacy, homelab, open source, self-hosted AI only

  - id: github-appstore
    name: GitHub stringer — AppStore releases
    kind: report
    hint: user-facing releases only

outlets:
  # The local Beacon aggregates claude-code and chrome-devtools only — there is
  # no discord-mcp on it — so this outlet is configured but cannot actually
  # deliver in dev. It exists so the managing editor has somewhere to placement stories and
  # the writer has a voice and slots to fill. Publishing is Phase 3.
  - id: discord-test
    name: Discord #news-test
    description: |
      Test channel. General audience of self-hosters. Announcements of app
      releases and curated external links worth their attention.
    role: publish
    driver: mcp
    voice: alicia
    endpoint: beacon
    tool: discord-mcp__send_embed
    args:
      channelId: "1514993197082742814"
      timestamp: true
      footer: "{{story.url}}"
      title:
        slot: text
        label: Headline
        max: 256
      description:
        slot: markdown
        label: Body
        max: 4096
        primary: true

  # The local sink. Nothing leaves the machine: the delivery port records the
  # payload and reports success, so approval, the payload freeze, the ledger and
  # the event log can all be exercised end to end without a real destination.
  # A dev Beacon has no discord-mcp, and an outlet that silently did nothing
  # would be indistinguishable from one that worked.
  - id: local-sink
    name: Local sink
    description: |
      Development sink. Placement a story here to watch the whole path — draft,
      review, approve, publish — without sending anything anywhere.
    role: publish
    driver: builtin
    voice: alicia
    args:
      title:
        slot: text
        label: Headline
        max: 256
      description:
        slot: markdown
        label: Body
        max: 4096
        primary: true

# ── Reporting ───────────────────────────────────────────────────────────────
# Switched OFF in dev: the phase needs a search endpoint the dev stack can
# actually reach, and our SearXNG lives on holyhorse behind the SSO gate, on a
# `pcs` network this machine is not part of.
#
# To try it, run a SearXNG locally with the json format enabled (settings.yml:
# `search: {formats: [html, json]}`) and uncomment the block below — the shape
# is verified, only the host changes. Without it tips go straight to the
# managing editor, unreported.
#
# reporting:
#   enabled: true
#   kinds: [tip]
#   search:
#     - driver: http
#       url: http://host.docker.internal:8080/search
#       args:
#         q: "{{ call.query }}"
#         format: json
#   fetch: []
