# Development configuration, seeded into the dev stack on first boot.
# Delete the volume to re-seed:  docker compose -f deploy/dev/docker-compose.dev.yml down -v

charter: |
  Curated external links about self-hosting, privacy, homelabs, open source and
  self-hosted AI go to the test channel, written for French-speaking
  self-hosters: what it is, why it matters to someone running their own server.

  Skip anything that is pure consumer tech news, a deal or a sponsored post.

  AppStore app releases go to the test channel too, written for a general
  public: what the app is, who it is for, what is new.

mcp_endpoints:
  # A Beacon aggregator running on YOUR machine, not in this stack.
  # The trailing slash matters: /mcp answers 307 to /mcp/.
  - id: beacon
    name: local beacon
    url: http://host.docker.internal:3000/mcp/

browser_engines:
  # The headed Chromium in this stack. `viewer: novnc` puts it inside the desk,
  # proxied behind the desk's own session — the container has no host port.
  - id: sidecar
    name: Dev browser
    api_base: http://browser:9746
    viewer: novnc

voices:
  - id: alicia
    name: Alicia
    tone: concise, technical, anti-hype; never invents a claim
    audience: self-hosters and homelabbers running a personal cloud
    rules: |
      No marketing superlatives. Always say who should care and why.
      Structure: what it is, what it is for, what is new, why it matters, how to get it.

stringers:
  - id: tip-line
    name: Tip line
    kind: tip

  - id: korben
    name: korben.info
    kind: timeline
    hint: self-hosting, privacy, homelab, open source, self-hosted AI only

  - id: github-appstore
    name: GitHub stringer — AppStore releases
    kind: report
    hint: user-facing releases only

outlets:
  # The local Beacon aggregates claude-code and chrome-devtools only — there is
  # no discord-mcp on it — so this outlet is configured but cannot actually
  # deliver in dev. It exists so the managing editor has somewhere to placement stories and
  # the writer has a voice and slots to fill. Publishing is Phase 3.
  - id: discord-test
    # Quoted: an unquoted `#` starts a YAML comment.
    name: "Discord #news-test"
    description: |
      Test channel. General audience of self-hosters. Announcements of app
      releases and curated external links worth their attention.
    role: publish
    driver: mcp
    voice: alicia
    endpoint: beacon
    tool: discord-mcp__send_embed
    args:
      channelId: "1514993197082742814"
      timestamp: true
      footer: "{{story.url}}"
      title:
        slot: text
        label: Headline
        max: 256
      description:
        slot: markdown
        label: Body
        max: 4096
        primary: true

  # The local sink. Nothing leaves the machine: the delivery port records the
  # payload and reports success, so approval, the payload freeze, the ledger and
  # the event log can all be exercised end to end without a real destination.
  # A dev Beacon has no discord-mcp, and an outlet that silently did nothing
  # would be indistinguishable from one that worked.
  - id: local-sink
    name: Local sink
    description: |
      Development sink. Placement a story here to watch the whole path — draft,
      review, approve, publish — without sending anything anywhere.
    role: publish
    driver: builtin
    voice: alicia
    args:
      title:
        slot: text
        label: Headline
        max: 256
      description:
        slot: markdown
        label: Body
        max: 4096
        primary: true

  # A destination with no API, published the way a person would: the desk opens
  # the page, types what you approved, proves it byte for byte, and then stops
  # so you can press their publish button. `composer` is the stand-in site in
  # this stack (deploy/dev/fixtures/composer.html) — swap the url and the
  # selectors and the same outlet drives a real one.
  - id: devgram
    name: Devgram
    description: |
      A site with no API. Placement a story here to watch a browser publish end
      to end — hand over, compose, byte-check, your click, then verify.
    role: publish
    driver: browser
    voice: alicia
    engine: sidecar
    args:
      # The page, pinned. The desk navigates here itself; the recipe never
      # names it, because a destination in prose is a destination a model or an
      # assistant could quietly move.
      url: "http://composer/"
      body:
        slot: markdown
        label: Post
        max: 4096
        primary: true
    recipe: |
      ## Stage
      The composer is the textarea at the top of the page.
      wait: textarea#composer
      fill: textarea#composer <- body

      ## Hand over
      Read the post, then press the green **Publish** button under the box.

      ## Verify
      The newest post appears first, with its permalink as the link above it.
      read: #posts a.permalink -> url

  # A real destination behind a real login. Docmost has an API, but driving it
  # through the browser is the point here: it exercises the sign-in handoff,
  # which is the part of browser publishing that needs a person.
  - id: docmost
    name: Docmost — yunderalabs
    description: |
      The internal knowledge base. Notes and write-ups for the team, not for an
      outside reader.
    role: publish
    driver: browser
    voice: alicia
    engine: sidecar
    args:
      url: "https://docmost-yunderalabs.nsl.sh/home"
      body:
        slot: markdown
        label: Note
        max: 8000
        primary: true
    recipe: |
      ## Signed out
      Docmost bounces an unauthenticated visit to /login, where the email field
      is the one thing a signed-in page never has.
      when: input#email[type="email"]

      ## Stage
      TODO: verified only as far as the login page. Docmost's editor is
      ProseMirror-based, so this is the shape it should take — check the
      selectors against the real editor once the browser is signed in.
      wait: div.ProseMirror[contenteditable="true"]
      fill: div.ProseMirror[contenteditable="true"] <- body

      ## Hand over
      Read the note, then publish it in Docmost.

# ── Reporting ───────────────────────────────────────────────────────────────
# Switched OFF in dev: the phase needs a search endpoint the dev stack can
# actually reach, and our SearXNG lives on holyhorse behind the SSO gate, on a
# `pcs` network this machine is not part of.
#
# To try it, run a SearXNG locally with the json format enabled (settings.yml:
# `search: {formats: [html, json]}`) and uncomment the block below — the shape
# is verified, only the host changes. Without it tips go straight to the
# managing editor, unreported.
#
# reporting:
#   enabled: true
#   kinds: [tip]
#   search:
#     - driver: http
#       url: http://host.docker.internal:8080/search
#       args:
#         q: "{{ call.query }}"
#         format: json
#   fetch: []
