<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Devgram — post something</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: #0f1115; color: #e6e8ec; }
      main { max-width: 44rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
      h1 { font-size: 1.1rem; letter-spacing: .02em; color: #9aa4b2; font-weight: 600; }
      #composer { width: 100%; min-height: 11rem; padding: .8rem; font: inherit; color: inherit;
                  background: #171a21; border: 1px solid #2a2f3a; border-radius: .5rem; resize: vertical; }
      button { margin-top: .8rem; padding: .55rem 1.1rem; font: inherit; font-weight: 600;
               color: #0f1115; background: #7dd3a0; border: 0; border-radius: .4rem; cursor: pointer; }
      button:hover { background: #6ec091; }
      #posts { margin-top: 2.5rem; padding: 0; list-style: none; }
      #posts li { padding: 1rem 0; border-top: 1px solid #2a2f3a; }
      #posts a { color: #7dd3a0; font-size: .8rem; text-decoration: none; }
      #posts pre { white-space: pre-wrap; margin: .4rem 0 0; font: inherit; }
      .empty { color: #6b7280; font-size: .85rem; }
    </style>
  </head>
  <body>
    <main>
      <!--
        A stand-in destination for the dev stack: a composer and a publish
        button, which is the whole shape of every site a browser outlet exists
        for. It lets the full path — hand over, compose, byte-check, a human
        pressing publish, verify — run with no third-party account and no
        terms of service to worry about.
      -->
      <h1>Devgram</h1>
      <textarea id="composer" placeholder="What's happening?"></textarea>
      <div><button id="publish">Publish</button></div>

      <ul id="posts">
        <li class="empty" id="empty">Nothing published yet.</li>
      </ul>
    </main>

    <script>
      let n = Number(localStorage.getItem('devgram:n') || 0)
      const posts = document.getElementById('posts')

      function render(id, text) {
        document.getElementById('empty')?.remove()
        const li = document.createElement('li')
        const a = document.createElement('a')
        a.className = 'permalink'
        // A permalink the desk's `## Verify` step can read off the page, which
        // is what turns "the operator says so" into evidence.
        a.href = `/post/${id}`
        a.textContent = `/post/${id}`
        const pre = document.createElement('pre')
        pre.textContent = text
        li.append(a, pre)
        posts.prepend(li)
      }

      for (const stored of JSON.parse(localStorage.getItem('devgram:posts') || '[]')) {
        render(stored.id, stored.text)
      }

      document.getElementById('publish').addEventListener('click', () => {
        const composer = document.getElementById('composer')
        const text = composer.value.trim()
        if (!text) return

        n += 1
        localStorage.setItem('devgram:n', String(n))
        const stored = JSON.parse(localStorage.getItem('devgram:posts') || '[]')
        stored.push({ id: n, text })
        localStorage.setItem('devgram:posts', JSON.stringify(stored))

        render(n, text)
        composer.value = ''
      })
    </script>
  </body>
</html>
