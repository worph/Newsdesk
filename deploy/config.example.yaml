# Newsdesk configuration.
#
# Copy this to your data volume as `config.yaml` BEFORE first boot and it will
# be imported once. After that the database is the source of truth and this
# file is ignored — edit the live configuration from the Configuration screen,
# so a stale file can never compete with a change you made in the app.

# ── The charter ─────────────────────────────────────────────────────────────
# Placement policy as prose: the standing brief a section editor would give. The
# managing editor reads this together with the outlet list and proposes where each
# story runs. Write it the way you would tell a colleague, not as configuration.
charter: |
  GitHub commits and dev-facing changes go to #dev: developers, technical
  register, what changed and why it matters to someone building on the platform.

  AppStore app releases go to #news for a general public: what the app is, who
  it is for, what is new.

  Curated external links go to SN news, audience French self-hosters.

  Anything touching internals that is not public-ready goes to Nextcloud Talk,
  internal only.

# ── Where MCP tools live ────────────────────────────────────────────────────
mcp_endpoints:
  - id: beacon
    name: yunderalabs beacon
    url: http://beacon-backend:9300/mcp

# ── Which browser the desk can drive ────────────────────────────────────────
# Only needed for `driver: browser` outlets — destinations with no API, where a
# person presses the publish button. Points at the sidecar in the compose file;
# its port is never published, so the desk is its only door.
#
# `viewer: novnc` embeds the live browser in the desk so you can read the post
# and click. Use `none` when you are sitting in front of the browser yourself.
browser_engines:
  - id: sidecar
    name: Newsdesk browser
    api_base: http://newsdesk-browser:9746
    viewer: novnc

# ── Voices ──────────────────────────────────────────────────────────────────
# A voice is tone, audience and rules, stored once and shared by outlets.
voices:
  - id: alicia
    name: Alicia
    tone: concise, technical, anti-hype; never invents a claim
    audience: self-hosters and homelabbers running a personal cloud
    rules: |
      No marketing superlatives. Always say who should care and why.
      Structure: what it is, what it is for, what is new, why it matters, how to get it.

  - id: internal-tech
    name: Internal tech
    tone: dry, factual, no framing for an outside reader
    audience: the team, who already have all the context
    rules: Assume the reader knows the codebase. Lead with the change itself.

# ── Who files ───────────────────────────────────────────────────────────────
# A stringer row describes what arrives, not how to fetch it — fetching lives in
# the workflow itself (n8n and the like), which POSTs free text to
# /api/v1/filings with the ingest token.
#
#   report    a written report, any depth ("what changed this week, with evidence")
#   timeline  dated entries; a watermark stops old ones being re-examined
#   snapshot  current state; diffed against the previous snapshot
#   tip       the internal tip line
stringers:
  - id: tip-line
    name: Tip line
    kind: tip

  # Compatibility with the old n8n pipeline's `telegram-idea` source: someone
  # @-mentions the bot in the ideas group and that message becomes a tip here.
  # A tip either way — a human note, considered whole, reported before the
  # managing editor reads it — so the only difference from the tip line above
  # is which door it came through, which is why it gets its own row.
  #
  # The polling lives in the n8n workflow, not here: see docs/stringers.md,
  # "Stringer 3 — Telegram ideas".
  - id: telegram-news-idea
    name: Telegram ideas
    kind: tip

  - id: github-appstore
    name: GitHub stringer — AppStore releases
    kind: report
    hint: user-facing releases only

  - id: korben
    name: korben.info
    kind: timeline
    hint: self-hosting, privacy, homelab, open source, self-hosted AI only

# ── Where it goes ───────────────────────────────────────────────────────────
# Each key under `args` mirrors an argument of the MCP tool and is one of:
#
#   literal   a pinned scalar               channelId: "1514993197082742814"
#   derived   a template over the story     footer: "{{story.url}}"
#   slot      written by the writer,        title: { slot: text, label: Headline }
#             edited and approved by you
#
# A publish outlet MUST pin its destination as a literal. Destination arguments
# are optional in the live MCP schemas, so an unpinned one does not error — it
# silently posts to whatever default the bridge is configured with. Newsdesk
# refuses to save such an outlet.
#
# Exactly one slot is `primary: true` — the document that gets the full editor
# and the assistant.
outlets:
  - id: discord-test
    # Quoted: an unquoted `#` starts a YAML comment, so this name would
    # otherwise be stored as "Discord".
    name: "Discord #news-test"
    description: test channel, general public audience, announcements of app releases
    role: publish
    driver: mcp
    voice: alicia
    endpoint: beacon
    tool: discord-mcp__send_embed
    # When this outlet posts, as opposed to what it posts. The desk proposes the
    # next slot that fits and shows it at review — you always see a time before
    # it is committed, and "Send now" is always there. Omit the whole block and
    # the outlet posts the moment you approve, as it did before scheduling.
    cadence:
      timezone: Europe/Paris   # optional; falls back to the desk timezone
      days: [1, 2, 3, 4, 5]    # 0 = Sunday
      window: { from: "09:00", to: "18:00" }
      min_gap_minutes: 90
      max_per_day: 3
    args:
      channelId: "1514993197082742814"
      timestamp: true
      # send_embed has no `url` parameter — the canonical link goes in the
      # footer, or as a markdown link inside the body.
      footer: "{{story.url}}"
      title:
        slot: text
        label: Headline
        max: 256
      description:
        slot: markdown
        label: Body
        max: 4096
        primary: true

  - id: telegram-broadcast
    name: Telegram broadcast
    description: the public Telegram channel, same stories as Discord in a shorter format
    role: publish
    driver: mcp
    voice: alicia
    endpoint: beacon
    tool: telegram-mcp__send_message
    args:
      chatId: "-5333649854"
      # Telegram parses the message text, so the two lines below are one
      # decision and the desk refuses to save them out of step.
      #
      # `HTML` is the only mode that can carry written copy. In `Markdown` and
      # `MarkdownV2` every _ * ` [ in the message is a delimiter that must be
      # closed, so a body containing AUTH_HASH or a snake_case identifier fails
      # the whole send with "can't parse entities".
      parseMode: HTML
      text:
        slot: markdown
        label: Message
        max: 4096
        primary: true
        # Converts the writer's markdown to Telegram's tags at merge time —
        # before approval freezes the payload, so you review what is sent.
        format: telegram-html

  # ── an outlet with no API ─────────────────────────────────────────────────
  # Some destinations have no MCP bridge and no webhook, and some forbid
  # automated posting outright. A browser outlet publishes the way a person
  # would: the desk opens the page, types the copy you approved, and checks it
  # byte for byte before anything is clicked.
  #
  # `publish` says who finishes it, and it is the field on this whole file worth
  # reading twice:
  #
  #   auto      the desk runs `## Commit` itself and verifies. Nobody is asked.
  #   tethered  it composes, stops, and you press the destination's own button
  #             in the viewer. This is the default when the field is absent.
  #   detached  it files a durable draft, hands you the link, and lets go — you
  #             finish it in your own browser, whenever.
  #
  # `requires_human: true` refuses `auto` for this outlet permanently, which is
  # what a destination whose *terms* need a person should carry. The mode is one
  # word; that line is the thing that makes flipping it a decision rather than
  # a typo.
  #
  # Needs the `browser` compose profile running. See docs/browser-publishing.md.
  #
  # - id: linkedin-company
  #   name: LinkedIn — company page
  #   description: the company page, for announcements a general audience would care about
  #   role: publish
  #   driver: browser
  #   voice: alicia
  #   engine: sidecar
  #   # LinkedIn is in scope precisely *because* a human presses the button.
  #   publish: tethered
  #   requires_human: true
  #   args:
  #     # The page, pinned. The desk navigates here itself and the recipe never
  #     # names it — a destination in prose an assistant helps edit is exactly
  #     # what invariant 3 exists to prevent.
  #     url: "https://www.linkedin.com/company/example/admin/page-posts/published/"
  #     body:
  #       slot: markdown
  #       label: Post
  #       max: 3000
  #       primary: true
  #   # Prose you edit, with step lines the desk executes. A line that is not a
  #   # step is for the person reading the live browser.
  #   recipe: |
  #     ## Stage
  #     The composer opens as a modal over the page.
  #     wait:  button.share-box-feed-entry__trigger
  #     click: button.share-box-feed-entry__trigger
  #     fill:  div.ql-editor[contenteditable="true"] <- body
  #
  #     ## Hand over
  #     Read it, then click "Post" at the bottom right of the modal.
  #
  #     ## Verify
  #     Optional. Without this the desk records your word that it went out.
  #     read: a.app-aware-link[href*='/feed/update/'] -> url

  # Uncomment once the argument keys are confirmed against a live call — that
  # Beacon exposes tool descriptions without schemas.
  # - id: nextcloud-tech
  #   name: Nextcloud Talk — internal
  #   description: internal technical notes, not for an outside audience
  #   role: publish
  #   driver: mcp
  #   voice: internal-tech
  #   endpoint: beacon
  #   tool: nextcloud-talk-mcp__talk_send_message
  #   destination_key: token
  #   args:
  #     token: "zyqsdmhx"
  #     message:
  #       slot: markdown
  #       label: Note
  #       primary: true

# ── Reporting ───────────────────────────────────────────────────────────────
# The phase between a tip being filed and the managing editor reading it: the
# desk searches, opens pages, and files a dossier of sourced claims and open
# questions. Omit this whole block to switch the phase off — tips then go
# straight to the managing editor.
#
# Listing a tool here IS the authorization to call it, unattended and without a
# prompt. That is safe because the model never names a tool: it supplies a
# query string, or a number from the catalogue the desk built. Which tool,
# which address and which argument shape are literals, here. For an `http`
# tool the url must be a literal — only `args` may interpolate, so nothing a
# model produces can decide which host the desk talks to.
#
# Each role is an ordered fallback chain: a retryable failure (timeout, 5xx,
# dead socket) moves to the next candidate, so put the fast one first and the
# one that always works last. A 4xx or a bad tool name does NOT fall through —
# that is a configuration error and must surface as one.
reporting:
  enabled: true
  # Which filing kinds get reported. Stringers already have credentials and
  # access, so by default only tips do.
  kinds: [tip]
  # Bounds enforced by the desk, not requested of the model. One worker runs
  # the queue, so a runaway reporter would block everything behind it.
  max_rounds: 3
  max_fetches: 8
  timeout_seconds: 60
  wall_clock_seconds: 480

  search:
    # SearXNG on the same PCS, over the shared `pcs` network — same convention
    # as the Beacon url above, and it bypasses the SSO gate that fronts the
    # public hostname. Verified against searxng 2026.7.31 on 2026-07-31:
    # `/search?q=…&format=json` returns {"query", "results":[{title,url,content}]}.
    #
    # `format: json` needs enabling on the instance — default SearXNG serves
    # html only and answers 403. In its settings.yml:
    #     search:
    #       formats: [html, json]
    - driver: http
      url: http://searxng-backend:8080/search
      args:
        q: "{{ call.query }}"
        format: json

  # No fetch tool is configured here, because none of our Beacons carries one:
  # a fetcher has to return page text in a SINGLE call, and chrome-devtools is
  # navigate-then-read across two stateful calls. Without it the reporter still
  # searches and still files — it just cannot open what it finds, so claims stay
  # in `unknowns`. Add one and the phase is whole:
  #
  # fetch:
  #   - driver: http
  #     url: http://reader:3000/extract     # a single-call url -> text service
  #     args:
  #       url: "{{ call.url }}"
  fetch: []
