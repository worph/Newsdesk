name: newsdesk

# Yundera AppStore packaging. Follows the house pattern (see e.g.
# Apps/AnnasTorrents in Yundera/AppStore): an AppShield sidecar terminates
# OIDC/Authelia SSO and proxies to a backend that carries no Caddy labels and
# is only reachable on the internal `pcs` network.
#
# NOTE: behind AppShield the user is already authenticated, so Newsdesk's own
# password login is a second gate. Trusting the sidecar's authenticated
# identity (and skipping the local login) is a follow-up — see
# IMPLEMENTATION.md section 9, "optional OIDC via casaos-oidc-bridge".

services:
  # ── AppShield sidecar (public) ──────────────────────────────────────
  newsdesk:
    image: ghcr.io/yundera/appshield:2.0.9
    container_name: newsdesk
    # AppShield builds its OIDC redirect URIs from os.hostname(), and the
    # auth-registrar attests the app name via the container's PTR record —
    # container_name and hostname must both equal the app name.
    hostname: newsdesk
    restart: unless-stopped
    user: "root"
    expose:
      - "80"
    labels:
      # Ordered `handle` blocks, first match wins: the PWA identity files go
      # STRAIGHT to the backend, everything else through the gate above.
      #
      # Why the bypass exists. Chrome does not draw the Android launcher icon
      # itself — on install it sends the manifest and icon URLs to Google's
      # WebAPK minting server, which fetches them from the public internet with
      # no session of ours. Behind AppShield that fetch is a 302 to the OIDC
      # login, minting fails, and Android falls back to a bookmark shortcut
      # stamped with the small Chrome badge in the corner. Serving these two
      # paths anonymously is what makes the install a real WebAPK with the real
      # icon. (MetaWatch does the same thing for /health; same mechanism.)
      #
      # Nothing here is a secret: the manifest is app metadata and the icons are
      # in the public repo. `/icon*` also lets an unknown /icon… path fall to the
      # SPA's index.html, which is likewise public code — no data reachable
      # without a session either way, since the whole API stays behind the gate.
      # ---- newsdesk-${APP_DOMAIN} (gateway TLS) ----
      caddy_0: newsdesk-${APP_DOMAIN}
      caddy_0.import: gateway_tls
      caddy_0.0_handle: "/manifest.webmanifest"
      caddy_0.0_handle.reverse_proxy: "newsdesk-backend:8080"
      caddy_0.1_handle: "/icon*"
      caddy_0.1_handle.reverse_proxy: "newsdesk-backend:8080"
      caddy_0.2_handle: ""
      caddy_0.2_handle.reverse_proxy: "{{upstreams 80}}"

      # ---- newsdesk-IP.nip.io (gateway TLS) ----
      caddy_1: newsdesk-${APP_PUBLIC_IP_DASH}.nip.io
      caddy_1.import: gateway_tls
      caddy_1.0_handle: "/manifest.webmanifest"
      caddy_1.0_handle.reverse_proxy: "newsdesk-backend:8080"
      caddy_1.1_handle: "/icon*"
      caddy_1.1_handle.reverse_proxy: "newsdesk-backend:8080"
      caddy_1.2_handle: ""
      caddy_1.2_handle.reverse_proxy: "{{upstreams 80}}"

      # ---- newsdesk-IP.sslip.io (Let's Encrypt) ----
      caddy_2: newsdesk-${APP_PUBLIC_IP_DASH}.sslip.io
      caddy_2.0_handle: "/manifest.webmanifest"
      caddy_2.0_handle.reverse_proxy: "newsdesk-backend:8080"
      caddy_2.1_handle: "/icon*"
      caddy_2.1_handle.reverse_proxy: "newsdesk-backend:8080"
      caddy_2.2_handle: ""
      caddy_2.2_handle.reverse_proxy: "{{upstreams 80}}"
    environment:
      BACKEND_HOST: "newsdesk-backend"
      BACKEND_PORT: "8080"
      LISTEN_PORT: "80"
      OIDC_REGISTRAR_URL: "http://auth-registrar:9092"
      REDIRECT_HOST_SUFFIXES: "${APP_DOMAIN},${APP_PUBLIC_IP_DASH}.nip.io,${APP_PUBLIC_IP_DASH}.sslip.io"
    depends_on:
      - newsdesk-backend
    networks:
      - pcs
    deploy:
      resources:
        limits:
          memory: 128M
    cpu_shares: 80

  # ── Newsdesk (protected) ────────────────────────────────────────────
  # On the pcs network so it can reach the Beacon aggregator by service name
  # for both the inference port and mcp-driver delivery outlets.
  newsdesk-backend:
    # A version tag: the workflow builds one for every `v*` git tag, so ghcr
    # carries these alongside `latest` and the per-commit tags. `latest` on a
    # store app would move under an install without anyone asking for it, so this
    # pins the release and the upgrade stays a deliberate edit. Bump it when a
    # new `v*` tag is cut.
    image: ghcr.io/worph/newsdesk:1.3.0
    container_name: newsdesk-backend
    restart: unless-stopped
    # Unprivileged, as the platform's 1000:1000. The data dir is created and
    # chowned by pre-install-cmd below so this process can write the database.
    user: 1000:1000
    expose:
      - "8080"
    environment:
      NEWSDESK_DATA_DIR: /data
      NEWSDESK_PORT: "8080"
      # First boot only; change it from the app afterwards.
      NEWSDESK_ADMIN_PASSWORD: "${NEWSDESK_ADMIN_PASSWORD:-}"
      # Bearer for the administration MCP server at POST /mcp. The beaconify
      # sidecar below is given the SAME value, which is the whole reason it is
      # named here rather than left to the generated default — two containers
      # cannot agree on a secret one of them minted at first boot.
      #
      # Leave it unset and the desk still generates one: the endpoint is never
      # open, the sidecar simply gets 401s until someone pastes the value from
      # Settings into this file.
      NEWSDESK_MCP_TOKEN: "${NEWSDESK_MCP_TOKEN:-}"
      # Public origin, for the OAuth redirect URI of endpoints that use it.
      # The app is served from the `newsdesk-` subdomain (see the Caddy labels
      # on the sidecar), not from APP_DOMAIN itself — an OAuth redirect built
      # from the bare domain lands on a different app entirely.
      NEWSDESK_PUBLIC_URL: "https://newsdesk-${APP_DOMAIN}"
      # The AppShield sidecar in front of us has already run the visitor
      # through Yundera SSO, so asking for the desk's own password as well is a
      # second login for no second fact. Naming the gate here makes a request
      # that arrived on the gate's socket count as authenticated.
      #
      # The socket, not a header: this container is reachable directly by
      # everything else on `pcs` (that is how stringers file), so any header
      # could be forged by a neighbour. The password login stays as the way in
      # for anyone reaching the backend directly.
      NEWSDESK_TRUSTED_GATE: newsdesk
      TZ: $TZ
    volumes:
      # newsdesk.db plus, on first boot only, a seed config.yaml.
      - /DATA/AppData/newsdesk/data/:/data
    networks:
      - pcs
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          memory: 128M

  # ── the desk, administered over MCP ─────────────────────────────────────
  # A beaconify sidecar makes `POST /mcp` discoverable by a Beacon aggregator:
  # it answers Beacon's UDP discovery, fetches the tool catalog itself, and
  # proxies calls through — adding the Authorization header on the way. The
  # token therefore never travels in the announce manifest, only between these
  # two containers.
  #
  # What this surface can do is configuration: the charter, outlets, voices,
  # stringers, endpoints, the reporting block, timezone, and the restore points
  # for all of it. What it cannot do is approve, publish or spike — a human
  # between every draft and every channel is the product, not a setting.
  #
  # Delete this service if you do not want the desk administrable by an agent.
  # Nothing else depends on it, and the endpoint stays shut without the token.
  newsdesk-mcp:
    image: ghcr.io/worph/beaconify:latest
    container_name: newsdesk-mcp
    restart: unless-stopped
    expose:
      - "9099"
    environment:
      BEACONIFY_NAME: newsdesk
      BEACONIFY_DESCRIPTION: "Newsdesk administration — charter, outlets, voices, stringers, config history and health."
      BEACONIFY_UPSTREAM_URL: "http://newsdesk-backend:8080/mcp"
      # The header, verbatim. Same value as NEWSDESK_MCP_TOKEN above.
      BEACONIFY_AUTH: "Bearer ${NEWSDESK_MCP_TOKEN:-}"
      TZ: $TZ
    depends_on:
      - newsdesk-backend
    networks:
      # `pcs` because that is where this box's Beacon is, and where the backend
      # is reachable. If your Beacon runs its discovery on a dedicated
      # `mcp-net` instead — which is the aggregator's own convention — add that
      # network here too and declare it external at the bottom of this file.
      # Discovery is multicast: the sidecar has to be on a network Beacon
      # actually probes, or it is simply never found.
      - pcs
    deploy:
      resources:
        limits:
          memory: 128M
    cpu_shares: 50

  # ── the browser, for outlets with no API ────────────────────────────────
  # Newsdesk's own instance, not the shared yunderalabs one: that browser is
  # busy with other work, and a publish that got its tab stolen mid-compose
  # would be a post half-typed into someone else's page.
  #
  # Nothing is exposed. The container is reachable only from the backend on
  # `pcs`, which proxies the noVNC surface behind the desk's own session — this
  # is an unauthenticated browser-control API in front of every destination the
  # profile is signed into. See docs/browser-publishing.md section 12.
  newsdesk-browser:
    # 1.1.5 is the floor, not a preference. It is the first release with the tab
    # registry (`/api/pages`) the desk opens a tab through, with `hover` — which
    # a recipe needs to reach any control that appears under the pointer — and
    # with the per-tab screencast the live view prefers. `1.1.4` has none of the
    # three, which is also why the shared `browsermcp` on this box cannot stand
    # in for this container.
    image: ghcr.io/worph/browser-mcp:1.1.5
    container_name: newsdesk-browser
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      VNC_RESOLUTION: "1440x900x24"
      MCP_PORT: "9746"
      # Logins live in the volume below, so reaping Chrome costs a cold start
      # and nothing else. Most of the day this container holds no browser.
      IDLE_TTL_MS: "900000"
      # Sweep tabs nobody owns. The desk closes its own on release, so anything
      # still here after half an hour is a leak — and a tab left on a signed-in
      # destination is the thing this container should be least casual about.
      PAGE_COLLECTOR: "on"
      PAGE_TTL_MS: "1800000"
      TZ: $TZ
    volumes:
      # The signed-in sessions. The one thing here that is expensive to rebuild.
      - /DATA/AppData/newsdesk/browser-profile/:/data/chrome-profile
    networks:
      - pcs
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 256M
    cpu_shares: 60

networks:
  pcs:
    name: pcs
    external: true

x-casaos:
  architectures:
    - amd64
    - arm64
  main: newsdesk
  webui_port: 80
  index: /
  # The dashboard tile's click URL. A store install has scheme/port_map/hostname
  # injected from the PCS REF_* env (casa-img, route/v2/appstore_pcs.go), which
  # only fills in keys that are absent — so pinning the two deployment-independent
  # ones here is a no-op there, and the difference between a working link and
  # http://<dashboard-host>:/ when the stack is installed from this file directly.
  # `hostname` stays out: it is REF_DOMAIN-specific (newsdesk-<domain>), so a
  # compose-file install has to add it by hand. Maison reads x-compose-app below
  # instead and resolves the host itself, so its tile is right either way.
  scheme: https
  port_map: "443"
  # Docker would otherwise create the bind mount as root:root and the
  # non-root runtime user could not write the database. Literal 1000:1000
  # because CasaOS install-time substitution strips ${VAR:-default} fallbacks;
  # $AppID it does substitute, so the path follows the house pattern.
  pre-install-cmd: |
    mkdir -p /DATA/AppData/$AppID/data &&
    mkdir -p /DATA/AppData/$AppID/browser-profile &&
    chown -R 1000:1000 /DATA/AppData/$AppID
  author: Yundera Team
  category: Productivity
  tags: ["automation", "personal"]
  developer: worph
  store_app_id: newsdesk
  # Served straight out of this repo (deploy/icon.png, deploy/thumbnail.png) —
  # the app owns its own artwork, so the tile is not waiting on Newsdesk landing
  # in the Yundera AppStore. jsDelivr caches a branch ref for a while; bump to a
  # tag (@v0.1.0) once the artwork stops changing. Both files are generated from
  # the .svg sources beside them: rsvg-convert -w 512 -h 512 -o icon.png icon.svg
  icon: https://cdn.jsdelivr.net/gh/worph/Newsdesk@main/deploy/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/worph/Newsdesk@main/deploy/thumbnail.png
  title:
    en_us: Newsdesk
  tagline:
    en_us: An editorial desk for automated news — nothing publishes without you.
    fr_fr: Une rédaction pour vos actualités automatisées, rien ne part sans vous.
  description:
    en_us: |
      **Sources push in, an LLM proposes what is worth saying and where, you edit
      and approve, and only then does anything get published.**

      Newsdesk is the spine of a news pipeline: a stringer registry, semantic
      deduplication, placement against a written editorial charter, per-destination
      drafting, and a full audit trail. Every integration stays outside the app —
      stringers file free text over HTTP, inference runs through a pluggable port,
      and delivery goes out through MCP outlets — so Newsdesk holds **no
      third-party credentials at all**.

      **What it does:**
      - Reads free-text reports from any stringer that can POST
      - Finds the stories in them and kills duplicates *semantically* — the same
        release arriving from three stringers becomes one story with three sources
      - Places each story by a charter you write in prose, not configuration
      - Drafts once per destination, in that destination's voice
      - Puts a human approval between every draft and every channel

      **Nothing auto-posts.** Publishing is a plain send of the exact bytes you
      approved — no model runs after approval.
    fr_fr: |
      **Vos sources alimentent le desk, un LLM propose ce qui mérite d'être dit et
      où, vous corrigez et validez, et rien n'est publié avant cela.**

      Newsdesk est la colonne vertébrale d'un pipeline d'actualités : registre de
      sources, déduplication sémantique, routage selon une charte éditoriale
      rédigée en français courant, rédaction par destination et journal d'audit
      complet. Toutes les intégrations restent à l'extérieur de l'application, si
      bien que Newsdesk ne détient **aucun identifiant tiers**.

      **Rien n'est publié automatiquement.** La publication envoie exactement le
      texte que vous avez validé, sans aucun modèle après validation.
  tips:
    before_install:
      en_us: |
        **First boot**
        - Set `NEWSDESK_ADMIN_PASSWORD` before installing, or read the generated
          password from the container logs on first start.
        - Open **Configuration** and write your charter, at least one voice, and
          at least one outlet. A publish outlet must pin its destination (channel
          id, chat id) as a literal — Newsdesk refuses to save otherwise, because
          an unpinned destination silently posts to the bridge default.

        **Wiring it up**
        - Point your stringers (n8n workflows, scripts, anything that can POST) at
          `/api/v1/filings` with the ingest token shown on the Configuration
          screen.
        - **Use the internal address for stringers:**
          `http://newsdesk-backend:8080/api/v1/filings`. The public URL is
          behind your Yundera single sign-on, which answers a token-authenticated
          POST with a login redirect, not an ingest. Anything on the `pcs`
          network — n8n included — can reach the backend directly.
        - Delivery outlets call MCP tools through your Beacon aggregator on the
          internal `pcs` network — Newsdesk never stores Discord or Telegram
          credentials.

        **Administering it from an agent** (optional)
        - Set `NEWSDESK_MCP_TOKEN` to any long random string before installing.
          The desk and the `newsdesk-mcp` sidecar both read it, which is the
          only way the two agree on a secret neither of them invented.
        - Your Beacon then discovers `newsdesk` and its configuration tools —
          charter, outlets, voices, stringers, history, health. Nothing there
          can approve or publish; that stays a person at the desk.
        - Leave the variable unset and the desk generates a token anyway: the
          endpoint is never open, the sidecar just gets refused until you paste
          the value from Settings. Delete the `newsdesk-mcp` service if you do
          not want the desk administrable this way at all.

        **Data** lives in `/DATA/AppData/newsdesk/data` as a single SQLite file.
        Backup is copying one file.

x-compose-app:
  webui-host: newsdesk-${domain}
