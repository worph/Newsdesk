<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!--
      `crossorigin="use-credentials"` is load-bearing behind the AppShield gate:
      a manifest is fetched in CORS mode with credentials OMITTED by default, so
      the perimeter sees an anonymous request, 302s it to the OIDC login, and the
      browser reports a CORS failure on the auth origin rather than the 401 it
      really is — and then applies no manifest at all.

      Belt and braces, not the whole fix. The manifest and the icons must ALSO
      be reachable anonymously, because Chrome does not build the Android
      launcher icon itself: it hands the URLs to Google's WebAPK minting server,
      which fetches them from outside with no session. Behind the gate that
      fetch 302s, minting fails, and Android installs a plain shortcut wearing
      the little Chrome badge instead of a real app icon. The public route for
      those paths is the Caddy `handle` block in
      deploy/docker-compose.yundera.yml.
    -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- For anything that will not take an SVG favicon, which still includes some Android launchers. -->
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <!-- Safari ignores an SVG here and falls back to a screenshot of the page, so this one has to be a PNG. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-title" content="Newsdesk" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- desk-50 and desk-950 from index.css: the status bar has to match the page it sits above. -->
    <meta name="theme-color" content="#f9fafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#040608" media="(prefers-color-scheme: dark)" />
    <title>Newsdesk</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
